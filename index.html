<title>Einsatzprotokoll Personensuche – Rettungshundestaffel · Offline</title>
<style>
  :root{
    --drk-red:#C8102E; --drk-red-dark:#8E0B22;
    --ink:#1B1B18; --muted:#6B675F; --muted-2:#8b8779;
    --paper:#F7F6F2; --panel:#FFFFFF; --line:#DDD8CC; --line-strong:#B9B29F;
    --input-bg:#FFFFFF; --card-bg:#fdfcfa; --readonly-bg:#f2f0ea;
    --amber:#B4650A; --amber-bg:#FCEEDB; --amber-text:#B4650A;
    --green:#1E6B3C; --green-bg:#E4F3E9; --green-text:#1E6B3C;
    --red-bg:#FBE2E4; --red-text:#8E0B22;
    --focus:#1858B0;
    --radius:8px;
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: light;
  }
  html[data-theme="dark"]{
    --ink:#ECE9E1; --muted:#B6B1A1; --muted-2:#8f8a78;
    --paper:#141310; --panel:#201E18; --line:#39352A; --line-strong:#4C4738;
    --input-bg:#241F16; --card-bg:#1C1A14; --readonly-bg:#2A2620;
    --amber-bg:#3C2A10; --amber-text:#F2A65A;
    --green-bg:#11311D; --green-text:#7BD79A;
    --red-bg:#3B141A; --red-text:#FF9AA8;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{padding-bottom:74px;}
  h1,h2,h3{font-family:var(--sans);margin:0 0 4px 0;font-weight:700;}
  input,select,textarea,button{font-family:inherit;font-size:16px;color:var(--ink);}
  a{color:var(--drk-red-dark);}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  button{cursor:pointer;}

  /* ---------- Topbar ---------- */
  #topbar{
    position:sticky;top:0;z-index:20;
    background:var(--drk-red);color:#fff;
    padding:10px 12px 8px 12px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  #topbar .row1{display:flex;align-items:center;gap:8px;}
  #topbar .cross{
    width:26px;height:26px;flex:0 0 auto;position:relative;
  }
  #topbar .cross:before,#topbar .cross:after{
    content:"";position:absolute;background:#fff;
  }
  #topbar .cross:before{left:10px;top:0;width:6px;height:26px;}
  #topbar .cross:after{left:0;top:10px;width:26px;height:6px;}
  #topbar h1{font-size:15px;line-height:1.2;color:#fff;}
  #topbar .sub{font-size:11.5px;opacity:.9;}
  #topbar .row2{display:flex;align-items:center;gap:8px;margin-top:8px;}
  #topbar input.einsatznr{
    flex:1 1 auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.5);
    color:#fff;border-radius:6px;padding:7px 9px;font-family:var(--mono);font-size:14px;
  }
  #topbar input.einsatznr::placeholder{color:rgba(255,255,255,.75);}
  #topbar .clock{font-family:var(--mono);font-size:13px;background:rgba(0,0,0,.18);border-radius:6px;padding:7px 8px;white-space:nowrap;}
  #topbar .theme-toggle{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:7px 9px;font-size:14px;flex:0 0 auto;}
  #savestatus{font-size:11px;opacity:.9;margin-top:4px;font-family:var(--mono);}
  #quickbar{display:flex;gap:6px;margin-top:7px;overflow-x:auto;padding-bottom:1px;}
  #quickbar button{flex:1 0 auto;border:1px solid rgba(255,255,255,.48);background:rgba(0,0,0,.16);color:#fff;border-radius:6px;padding:7px 8px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  #quickbar .net{flex:0 0 auto;cursor:default;}
  #quickbar .net.offline{background:#fff;color:var(--drk-red-dark);}

  /* ---------- Tabs ---------- */
  #tabs{
    position:sticky;bottom:0;z-index:20;
    display:flex;overflow-x:auto;background:var(--panel);border-top:1px solid var(--line-strong);
    box-shadow:0 -2px 6px rgba(0,0,0,.08);
  }
  #tabs button{
    flex:1 0 auto;min-width:78px;background:none;border:none;padding:8px 4px 7px 4px;
    display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);
    border-top:3px solid transparent;
  }
  #tabs button .ic{font-size:18px;line-height:1;}
  #tabs button .lb{font-size:10.5px;font-weight:600;letter-spacing:.02em;}
  #tabs button.active{color:var(--drk-red);border-top-color:var(--drk-red);}

  /* ---------- Layout ---------- */
  main{padding:14px 12px 24px 12px;max-width:640px;margin:0 auto;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
  .panel h2{font-size:14.5px;text-transform:none;color:var(--drk-red-dark);border-bottom:2px solid var(--drk-red);padding-bottom:6px;margin-bottom:12px;}
  .panel h3{font-size:13px;color:var(--muted);margin:14px 0 8px 0;}
  .hint{font-size:12px;color:var(--muted);margin-top:3px;}
  .warnbox{background:var(--red-bg);border:1px solid var(--drk-red);color:var(--red-text);border-radius:var(--radius);padding:10px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.4;}
  .field{margin-bottom:12px;min-width:0;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],
  .field select,.field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line-strong);border-radius:7px;background:var(--input-bg);
  }
  .field textarea{min-height:64px;resize:vertical;}
  .readonly-field{background:var(--readonly-bg) !important;}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
  .grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:10px;}
  .timefield{display:flex;gap:6px;min-width:0;}
  .timefield input{flex:1;min-width:0;}
  .btn-now{flex:0 0 auto;background:#1B1B18;color:#fff;border:none;border-radius:7px;padding:0 10px;font-size:12px;font-weight:600;}
  .btn-mic{flex:0 0 auto;background:#1B1B18;color:#fff;border:none;border-radius:7px;padding:0 12px;font-size:14px;}
  .pillgroup{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{position:relative;}
  .pill input{position:absolute;opacity:0;pointer-events:none;}
  .pill span{
    display:inline-block;padding:8px 12px;border:1px solid var(--line-strong);border-radius:999px;
    font-size:12.5px;background:var(--input-bg);color:var(--ink);
  }
  .pill input:checked + span{background:var(--drk-red);border-color:var(--drk-red);color:#fff;font-weight:600;}
  .pill input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px;}
  .checkrow{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13.5px;}
  .checkrow input{width:20px;height:20px;}

  .card{border:1px solid var(--line-strong);border-radius:var(--radius);padding:11px;margin-bottom:10px;background:var(--card-bg);}
  .card .cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .card .cardhead .idx{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .card .del{background:none;border:none;color:var(--red-text);font-size:16px;padding:2px 6px;}
  .addbtn{width:100%;padding:11px;border:1.5px dashed var(--line-strong);border-radius:var(--radius);background:none;color:var(--red-text);font-weight:700;font-size:13.5px;margin-top:2px;}
  .geobox{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .geobox .val{font-family:var(--mono);font-size:11.5px;color:var(--muted);}
  .btn-geo{background:none;border:1px solid var(--line-strong);border-radius:7px;padding:6px 9px;font-size:12px;}

  .counterbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .counter{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--muted);}
  .counter b{display:block;font-size:18px;color:var(--ink);font-family:var(--mono);}

  .prioband{border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;border:1px solid;}
  .prioband.hoch{background:var(--red-bg);border-color:var(--drk-red);color:var(--red-text);}
  .prioband.mittel{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-text);}
  .prioband.niedrig{background:var(--green-bg);border-color:var(--green);color:var(--green-text);}
  .prioband .big{font-size:17px;font-weight:800;letter-spacing:.01em;}
  .prioband .sum{font-family:var(--mono);font-size:12px;opacity:.85;margin-top:2px;}

  .riskcat{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px;}
  .riskcat:last-child{border-bottom:none;}
  .riskcat .lbl{font-size:13px;font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:6px;}
  .riskcat .grau-mark{font-size:10px;background:#1B1B18;color:#fff;border-radius:4px;padding:1px 5px;font-weight:700;}
  .rangebox{display:flex;align-items:center;gap:8px;margin-top:7px;padding:8px;background:var(--readonly-bg);border-radius:7px;}
  .rangebox input[type=number]{width:64px;padding:6px;border:1px solid var(--line-strong);border-radius:6px;background:var(--input-bg);}
  .rangebox input[type=range]{flex:1;}

  .thumbgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .thumb{border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;background:var(--card-bg);}
  .thumb img{width:100%;height:120px;object-fit:cover;display:block;background:var(--readonly-bg);}
  .thumb .meta{padding:6px 8px;font-size:11px;color:var(--muted);}
  .thumb .meta .nm{color:var(--ink);font-weight:600;font-size:12px;display:block;margin-bottom:2px;}
  .thumb .row{display:flex;justify-content:space-between;padding:0 8px 8px 8px;}
  .thumb .row button{font-size:11px;padding:5px 8px;border-radius:6px;border:1px solid var(--line-strong);background:var(--input-bg);}
  .trackcard{border:1px solid var(--line-strong);border-radius:var(--radius);padding:10px;margin-top:10px;background:var(--card-bg);}
  .trackcard svg{width:100%;height:150px;display:block;background:var(--readonly-bg);border-radius:6px;margin:8px 0;}
  .trackmeta{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;}

  .menurow{display:flex;flex-direction:column;gap:8px;}
  .menurow button.action{
    text-align:left;padding:11px 12px;border-radius:var(--radius);border:1px solid var(--line-strong);
    background:var(--input-bg);font-size:13.5px;font-weight:600;color:var(--ink);
  }
  .menurow button.action.danger{color:var(--red-text);border-color:var(--drk-red);}
  .archentry{border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px;margin-bottom:8px;font-size:12.5px;}
  .archentry .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .archentry .row button{font-size:11.5px;padding:5px 9px;border-radius:6px;border:1px solid var(--line-strong);background:var(--input-bg);color:var(--ink);margin-left:6px;}
  .statbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .statbox .s{background:var(--readonly-bg);border-radius:7px;padding:8px 10px;}
  .statbox .s b{display:block;font-family:var(--mono);font-size:16px;}
  .statbox .s span{font-size:11px;color:var(--muted);}
  .statusline{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:-2px 0 10px;}
  .statusbadge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;background:var(--readonly-bg);border:1px solid var(--line);}
  .statusbadge.laufend{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber);}
  .statusbadge.fertig{background:var(--green-bg);color:var(--green-text);border-color:var(--green);}
  .quickchoices{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;}
  .quickchoices button{flex:0 0 auto;padding:7px 9px;border-radius:999px;border:1px solid var(--line-strong);background:var(--input-bg);color:var(--ink);font-size:12px;}
  .checklist{margin:0;padding-left:20px;font-size:12.5px;line-height:1.55;}
  .check-ok{color:var(--green-text);font-weight:700;}
  .check-warn{color:var(--amber-text);font-weight:700;}
  #toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:10px;max-width:calc(100% - 24px);background:#1b1b18;color:#fff;border-radius:8px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.3);font-size:12.5px;}
  #toast button{border:1px solid #fff;background:none;color:#fff;border-radius:5px;padding:4px 8px;font-weight:700;}
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;}

  #printArea{display:none;}
  @media print{
    #topbar,#tabs,main,#toast{display:none !important;}
    #printArea{display:block !important;padding:0;margin:0;font-family:Arial, sans-serif;color:#000;background:#fff;}
    .pg{padding:14px 16px;page-break-after:always;}
    .pg:last-child{page-break-after:auto;}
    .pghead{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #C8102E;padding-bottom:6px;margin-bottom:10px;}
    .pghead h2{margin:0;font-size:15px;}
    .pghead .st{font-size:10px;color:#555;}
    .ptable{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11.5px;}
    .ptable td,.ptable th{border:1px solid #999;padding:5px 6px;text-align:left;vertical-align:top;}
    .ptable th{background:#eee;width:34%;}
    .pnote{font-size:10px;color:#555;margin-top:4px;}
    .pflag{background:#FBE2E4;border:1px solid #C8102E;padding:4px 7px;font-size:10px;font-weight:700;display:inline-block;margin-bottom:8px;color:#8E0B22;}
  }
</style>
<style id="ux-compact-style">:root{--ux-content-max:980px} main,.app,#content{max-width:var(--ux-content-max);margin-left:auto;margin-right:auto}.ux-help-details{margin:.75rem 0 1rem;border:1px solid rgba(127,127,127,.28);border-radius:12px;padding:.1rem .8rem;background:rgba(127,127,127,.045)}.ux-help-details>summary{cursor:pointer;font-weight:700;padding:.75rem .1rem;line-height:1.3}.ux-help-details[open]>summary{margin-bottom:.35rem}@media(max-width:700px){main,.app,#content{max-width:100%}.ux-help-details{border-radius:10px;margin:.6rem 0;padding:.05rem .65rem}h1{line-height:1.15}h2{line-height:1.2}}</style>
</head>
<body>

<header id="topbar">
  <div class="row1">
    <div class="cross" aria-hidden="true"></div>
    <div>
      <h1>Einsatzprotokoll Personensuche</h1>
      <div class="sub">Rettungshundestaffel</div>
    </div>
  </div>
  <div class="row2">
    <input class="einsatznr" id="inp-einsatznummer" placeholder="Einsatznummer eintragen…" autocomplete="off">
    <button class="theme-toggle" id="btn-theme" type="button" title="Hell/Dunkel umschalten">🌙</button>
    <div class="clock" id="clock">--:--:--</div>
  </div>
  <div id="savestatus">wird geladen…</div>
  <div id="quickbar" aria-label="Schnellzugriff">
    <button type="button" data-quick="log" title="Alt+T">＋ Tagebuch</button>
    <button type="button" data-quick="trupp" title="Alt+S">＋ Suchtrupp</button>
    <button type="button" data-quick="check" title="Alt+P">✓ Prüfen</button>
    <button type="button" class="net" id="netstatus" tabindex="-1">Offline bereit</button>
  </div>
</header>

<nav id="tabs">
  <button data-tab="alarm"><span class="ic">📋</span><span class="lb">Alarm</span></button>
  <button data-tab="person"><span class="ic">🧍</span><span class="lb">Person</span></button>
  <button data-tab="kraefte"><span class="ic">👥</span><span class="lb">Kräfte</span></button>
  <button data-tab="suche"><span class="ic">🐕</span><span class="lb">Suche</span></button>
  <button data-tab="tagebuch"><span class="ic">🕒</span><span class="lb">Tagebuch</span></button>
  <button data-tab="abschluss"><span class="ic">✅</span><span class="lb">Abschluss</span></button>
  <button data-tab="anlagen"><span class="ic">🗺️</span><span class="lb">Anlagen</span></button>
  <button data-tab="mehr"><span class="ic">⋯</span><span class="lb">Mehr</span></button>
</nav>

<main id="content"></main>

<div id="printArea"></div>
<div id="toast" role="status" aria-live="polite"><span id="toasttext"></span><button id="toastundo" type="button">Rückgängig</button></div>

<script>
'use strict';

/* ======================================================================
   KONFIGURATION
   ====================================================================== */

// Kategorien der Vermissten-Risikobewertung. "grau:true" markiert die
// Kategorien, die im Original-Formular grau hinterlegt sind: Wird dort
// der niedrigste Punktwert (1) vergeben, gilt automatisch "Gefahr in
// Verzug" – unabhängig von der Gesamtsumme (siehe Anmerkung 1 im
// Originalformular). HINWEIS: Diese Zuordnung wurde aus der Rasterung
// des PDFs (Stand 07.02.2017) abgelesen. Bitte einmal mit dem eigenen
// Papierformular abgleichen und bei Abweichung hier anpassen.
const RISIKO_KATEGORIEN = [
  { key:'anzahl', label:'Anzahl der Personen', grau:true, optionen:[
    { tag:'einzel', text:'Eine Person, alleine', points:1 },
    { tag:'mehrere', text:'Mehrere Personen', range:[2,3] },
  ]},
  { key:'alter', label:'Alter', grau:false, optionen:[
    { tag:'kind', text:'Kind (≤ 14 Jahre)', points:1 },
    { tag:'aelter', text:'Älterer Mensch (≥ 65 Jahre)', points:1 },
    { tag:'andere', text:'Andere', range:[2,3] },
  ]},
  { key:'medizinisch', label:'Medizinischer Zustand', grau:true, optionen:[
    { tag:'lebensbedrohlich', text:'Bekannte lebensbedrohliche Krankheiten', points:1 },
    { tag:'verletzt', text:'Bekannte oder vermutete Verletzungen/Krankheiten', range:[1,2] },
    { tag:'tod', text:'Bekanntes Verhängnis (Tod)', points:3 },
  ]},
  { key:'psychisch', label:'Psychischer Zustand', grau:false, optionen:[
    { tag:'ausnahmezustand', text:'Vermuteter psychischer Ausnahmezustand', points:1 },
    { tag:'erkrankung', text:'Bekannte psychische Erkrankung', range:[1,2] },
    { tag:'gesund', text:'Gesund', points:3 },
  ]},
  { key:'wetter', label:'Wetter der letzten 8 Stunden', grau:true, optionen:[
    { tag:'extrem', text:'Extreme Temperaturen, ggf. starker Regen/Wind', points:1 },
    { tag:'regen', text:'Regenschauer / schwache Brise, kühler', range:[1,2] },
    { tag:'trocken', text:'Trocken, warm, windstill', points:3 },
  ]},
  { key:'kleidung', label:'Kleidung', grau:false, optionen:[
    { tag:'leicht', text:'Leichte Bekleidung', points:1 },
    { tag:'alltag', text:'Alltagsbekleidung mit Jacke/Hose/Sweatshirt', range:[1,2] },
    { tag:'wetterfest', text:'Wetterfeste Kleidung', points:3 },

const lokalerSpeicher = (()=>{

    let fallbackAktiv=false;
    const dbp = new Promise((resolve,reject)=>{
      const req = indexedDB.open('RHS-Einsatzprotokoll',1);
      req.onupgradeneeded=()=>req.result.createObjectStore('daten');
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
    const tx = async (mode, fn)=>{
      const db=await dbp;
      return new Promise((resolve,reject)=>{
        const t=db.transaction('daten',mode), store=t.objectStore('daten');
        const req=fn(store);
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>reject(req.error);
      });
    };
    const mitFallback=async(op,ersatz)=>{ try{return await op();}catch(e){fallbackAktiv=true;return ersatz();} };
    return {
      get name(){return fallbackAktiv?'Browser-Speicher':'Offline-Datenbank';},
      get:k=>mitFallback(async()=>({value:await tx('readonly',s=>s.get(k))}),()=>({value:localStorage.getItem(k)})),
      set:(k,v)=>mitFallback(()=>tx('readwrite',s=>s.put(v,k)),()=>localStorage.setItem(k,v)),
      delete:k=>mitFallback(()=>tx('readwrite',s=>s.delete(k)),()=>localStorage.removeItem(k))
    };
  }
  return {
    name:'Browser-Speicher',
    get:async k=>({value:localStorage.getItem(k)}),
    set:async(k,v)=>localStorage.setItem(k,v),

})();

function tiefZusammenfuehren(vorgabe, geladen){
  if(Array.isArray(vorgabe)) return Array.isArray(geladen) ? geladen : vorgabe;
  if(vorgabe && typeof vorgabe==='object'){
    const out={...vorgabe};
    if(geladen && typeof geladen==='object') Object.keys(geladen).forEach(k=>{
      out[k] = k in vorgabe ? tiefZusammenfuehren(vorgabe[k], geladen[k]) : geladen[k];
    });
    return out;
  }
  return geladen===undefined ? vorgabe : geladen;
}

function normalisiereState(geladen){
  const neu=tiefZusammenfuehren(defaultState(), geladen||{});
  neu.kraefte=(neu.kraefte||[]).map(k=>tiefZusammenfuehren({funktion:'HF',name:'',eintreffen:'',verlaesst:'',fahrzeug:'',bereitschaft:'',bestaetigt:''},k));

  neu.tracks=Array.isArray(neu.tracks)?neu.tracks:[];

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getByPath(obj, path){ return path.split('.').reduce((o,k)=> (o==null? o : o[k]), obj); }
function setByPath(obj, path, val){
  const parts = path.split('.');
  const last = parts.pop();
  const target = parts.reduce((o,k)=> o[k], obj);
  target[last] = val;
}
function minutenDiff(t1, t2){
  // t1, t2 im Format HH:MM. Geht von gleichem Tag aus, wickelt über Mitternacht.
  if(!t1 || !t2) return '';
  const [h1,m1] = t1.split(':').map(Number);
  const [h2,m2] = t2.split(':').map(Number);
  if([h1,m1,h2,m2].some(isNaN)) return '';
  let diff = (h2*60+m2) - (h1*60+m1);
  if(diff < 0) diff += 24*60;
  return diff;
}

function berechneRisiko(werte){
  let summe = 0, grauAusloeser = false;
  for(const kat of RISIKO_KATEGORIEN){
    const w = Number(werte[kat.key]?.wert ?? 1);
    summe += w;
    if(kat.grau && w === 1) grauAusloeser = true;
  }
  let stufe;
  if(grauAusloeser || summe <= 11) stufe = 'hoch';
  else if(summe <= 16) stufe = 'mittel';
  else stufe = 'niedrig';
  return {summe, stufe, grauAusloeser};
}

function geoErfassen(erfolg){
  if(!navigator.geolocation){ alert('Standortabfrage wird von diesem Browser nicht unterstützt.'); return; }
  erfolg._btn && (erfolg._btn.textContent = '…');
  navigator.geolocation.getCurrentPosition(
    pos => erfolg({
      lat: Number(pos.coords.latitude.toFixed(6)),
      lon: Number(pos.coords.longitude.toFixed(6)),
      acc: Math.round(pos.coords.accuracy)
    }),
    err => alert('Standort konnte nicht ermittelt werden: ' + err.message + ' (Hinweis: Standortfreigabe im Browser nötig; ohne GPS-Empfang ungenau.)'),
    { enableHighAccuracy:true, timeout:12000 }
  );
}

/* ---------- Diktat (Web Speech API) ---------- */

function starteDiktat(btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Spracheingabe wird von diesem Browser nicht unterstützt. Alternativ das Mikrofon der Bildschirmtastatur nutzen.'); return; }
  const ta = document.getElementById(btn.dataset.diktTarget);
  if(!ta) return;
  const rec = new SR();
  rec.lang = 'de-DE';
  rec.interimResults = false;
  rec.continuous = false;
  const altIcon = btn.textContent;
  btn.textContent = '🔴';
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    ta.value = (ta.value ? ta.value.trim() + ' ' : '') + text;
    ta.dispatchEvent(new Event('input', {bubbles:true}));
  };
  rec.onerror = () => { alert('Spracheingabe fehlgeschlagen oder abgebrochen.'); };
  rec.onend = () => { btn.textContent = altIcon; };
  try{ rec.start(); }catch(e){ btn.textContent = altIcon; }
}

/* ---------- Wetter-Codes (Open-Meteo / WMO) ---------- */

function wmoZuWetterlage(code){
  if(code===0) return 'klar';
  if([1,2,3].includes(code)) return 'bewoelkt';
  if([45,48].includes(code)) return 'nebel';
  if([71,73,75,77,85,86].includes(code)) return 'schnee';
  if([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code)) return 'regen';
  return 'bewoelkt';
}
function gradZuKompass(deg){
  const dirs = ['N','NO','O','SO','S','SW','W','NW'];
  return dirs[Math.round(deg/45) % 8];
}

    <div class="field"><label>Geschlecht</label>

      const cur = state.risiko.aktuelle[kat.key] || {};
      return `
      <div class="riskcat">
        <div class="lbl">${esc(kat.label)} ${kat.grau?'<span class="grau-mark">Ø bei 1 = Gefahr in Verzug</span>':''}</div>

            </label>
          `).join('')}
        </div>
        ${(()=>{
          const opt = optionByTag(kat, cur.tag);
          if(opt && opt.range){
            return `<div class="rangebox">
              <span style="font-size:12px;color:var(--muted)">Punktwert:</span>
              <input type="range" min="${opt.range[0]}" max="${opt.range[1]}" step="1" value="${cur.wert}" data-riskrange="${kat.key}">
              <input type="number" min="${opt.range[0]}" max="${opt.range[1]}" value="${cur.wert}" data-riskrangenum="${kat.key}">
            </div>`;
          }
          return '';
        })()}
      </div>`;
    }).join('')}

    ${state.risiko.verlauf.length? `
      <h3>Verlauf früherer Bewertungen</h3>
      ${state.risiko.verlauf.slice().reverse().map(v=>`
        <div class="card"><div class="cardhead"><span class="idx">${esc(v.zeit)}</span><span class="idx">${v.summe} Pkt. · ${PRIO_TEXT[v.stufe].split(' –')[0]}</span></div></div>
      `).join('')}
    ` : ''}
  </div>
  `;
}

function tplTrackCard(t,i){
  return `<div class="trackcard">
    <div class="cardhead"><b>${esc(t.name||('Track '+(i+1)))}</b><button class="del" data-action="remove-track" data-index="${i}" type="button">🗑</button></div>
    ${trackSvg(t.points||[])}
    <div class="trackmeta"><span>${Number(t.distanzKm||0).toFixed(2)} km</span><span>${(t.points||[]).length} Punkte</span><span>${esc(t.format||'GPX')}</span></div>
    <div class="field" style="margin-top:8px;"><label>Zuordnung / Notiz</label><input type="text" data-list="tracks" data-index="${i}" data-field="notiz" value="${esc(t.notiz||'')}" placeholder="z. B. Suchgebiet 3, Trupp 2"></div>
  </div>`;
}
function trackSvg(points){
  if(!points || points.length<2) return '<div class="hint">Keine darstellbare Trackgeometrie.</div>';
  const lats=points.map(p=>p.lat), lons=points.map(p=>p.lon), minLat=Math.min(...lats), maxLat=Math.max(...lats), minLon=Math.min(...lons), maxLon=Math.max(...lons);
  const dx=Math.max(maxLon-minLon,0.000001), dy=Math.max(maxLat-minLat,0.000001), pad=8;
  const xy=points.map(p=>`${(pad+(p.lon-minLon)/dx*(100-pad*2)).toFixed(2)},${(100-pad-(p.lat-minLat)/dy*(100-pad*2)).toFixed(2)}`).join(' ');
  return `<svg viewBox="0 0 100 100" role="img" aria-label="Vereinfachte Track-Vorschau"><polyline points="${xy}" fill="none" stroke="#C8102E" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${xy.split(' ')[0].split(',')[0]}" cy="${xy.split(' ')[0].split(',')[1]}" r="2" fill="#1E6B3C"/><circle cx="${xy.split(' ').slice(-1)[0].split(',')[0]}" cy="${xy.split(' ').slice(-1)[0].split(',')[1]}" r="2" fill="#C8102E"/></svg>`;
}
function tplAnlageThumb(a,i){

function pruefErgebnis(){
  const fehlt=[];
  const m=state.meta, a=state.abschluss;
  if(!m.einsatznummer) fehlt.push('Einsatznummer fehlt');
  if(!m.datum) fehlt.push('Einsatzdatum fehlt');
  if(!m.einsatzort && !m.sammelpunkt) fehlt.push('Einsatzort oder Sammelpunkt fehlt');
  if(!m.alarmzeitLST && !m.alarmzeitEK) fehlt.push('Alarmzeit fehlt');
  if(!m.eigeneEinsatzleitung) fehlt.push('Eigene Einsatzführung fehlt');
  if(!m.auftrag) fehlt.push('Auftrag der Rettungshundestaffel fehlt');
  if(!state.person.name) fehlt.push('Name der vermissten Person fehlt');
  if(!state.risiko.verlauf.length) fehlt.push('Risikobewertung wurde noch nicht mit Zeitstempel protokolliert');
  state.suchtrupps.forEach((s,i)=>{
    const nr=i+1;
    if(!s.team) fehlt.push(`Trupp ${nr}: Team fehlt`);
    if(!s.gebietNr) fehlt.push(`Trupp ${nr}: Suchgebiet fehlt`);
    if(s.beginn && !s.ende) fehlt.push(`Trupp ${nr}: Suche läuft noch / Endzeit fehlt`);
    if(s.ende && !s.abdeckung) fehlt.push(`Trupp ${nr}: Gebietsabdeckung fehlt`);
    if(s.ende && !s.ergebnis) fehlt.push(`Trupp ${nr}: Ergebnis fehlt`);
  });
  if(!m.einsatzende) fehlt.push('Einsatzende fehlt');
  if(!a.ergebnis) fehlt.push('Gesamtergebnis fehlt');
  if(!a.abschlussDatum || !a.abschlussName) fehlt.push('Abschlussdatum oder Bestätigung fehlt');
  return fehlt;
}
function tplPruefung(){

async function statistikBerechnen(){
  const out = document.getElementById('statistik-ausgabe');
  if(!out) return;
  out.innerHTML = '<div class="hint">wird berechnet…</div>';
  let index = [];
  try{ const r = await lokalerSpeicher.get(KEY_ARCHIV_INDEX); if(r&&r.value) index = JSON.parse(r.value); }catch(e){}
  if(!index.length){ out.innerHTML = '<div class="hint">Noch keine archivierten Einsätze vorhanden.</div>'; return; }

  const einsaetze = [];
  for(const e of index){
    try{ const r = await lokalerSpeicher.get('archiv:'+e.id); einsaetze.push(normalisiereState(JSON.parse(r.value))); }catch(err){}
  }
  if(!einsaetze.length){ out.innerHTML = '<div class="hint">Archiv-Daten konnten nicht geladen werden.</div>'; return; }

  const alarmZeiten = einsaetze.map(s=>Number(s.meta?.alarmierungszeitMin)).filter(n=>!isNaN(n) && n>=0);
  const avgAlarm = alarmZeiten.length? Math.round(alarmZeiten.reduce((a,b)=>a+b,0)/alarmZeiten.length) : null;

  const prio = {hoch:0, mittel:0, niedrig:0};
  einsaetze.forEach(s=>{
    if(s.risiko?.aktuelle){ const r = berechneRisiko(s.risiko.aktuelle); prio[r.stufe]++; }
  });

  const sucharten = {WS:0,FL:0,MT:0,TR:0};
  let anzahlTrupps = 0;
  einsaetze.forEach(s=>(s.suchtrupps||[]).forEach(t=>{
    anzahlTrupps++;
    Object.keys(sucharten).forEach(k=>{ if(t.suchart && t.suchart[k]) sucharten[k]++; });
  }));

  out.innerHTML = `
    <div class="statbox">
      <div class="s"><b>${einsaetze.length}</b><span>Archivierte Einsätze</span></div>
      <div class="s"><b>${avgAlarm!==null? avgAlarm+' Min.' : '–'}</b><span>Ø Alarmierungszeit</span></div>
      <div class="s"><b>${anzahlTrupps}</b><span>Suchtrupps gesamt</span></div>
      <div class="s"><b>${einsaetze.length? (anzahlTrupps/einsaetze.length).toFixed(1) : '–'}</b><span>Ø Trupps/Einsatz</span></div>
      <div class="s"><b>${prio.hoch} / ${prio.mittel} / ${prio.niedrig}</b><span>Priorität Hoch/Mittel/Niedrig</span></div>
      <div class="s"><b>${Object.entries(sucharten).map(([k,v])=>k+':'+v).join(' ')}</b><span>Sucharten-Einsätze</span></div>
    </div>
  `;
}

  const arr = state[list];

    if(!arr[index][a]) arr[index][a] = {};
    arr[index][a][b] = val;
  } else {
    arr[index][field] = val;
  }
}

function bildVerkleinern(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      img.onerror = reject;
      img.onload = () => {
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
          else { width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- Gaia-GPS-Trackimport (GPX/KML, vollständig offline) ---------- */

function rad(v){ return v*Math.PI/180; }
function streckeKm(points){
  let sum=0;
  for(let i=1;i<points.length;i++){
    const a=points[i-1],b=points[i], dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon);
    const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
    sum+=6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
  }
  return sum;
}
function reduzierePunkte(points,max=1200){
  if(points.length<=max) return points;
  const out=[], step=(points.length-1)/(max-1);
  for(let i=0;i<max;i++) out.push(points[Math.round(i*step)]);
  return out;
}
function punktAusNode(n){
  const lat=Number(n.getAttribute('lat')),lon=Number(n.getAttribute('lon'));
  if(!Number.isFinite(lat)||!Number.isFinite(lon)) return null;
  const ele=n.getElementsByTagNameNS('*','ele')[0]?.textContent||'';
  const time=n.getElementsByTagNameNS('*','time')[0]?.textContent||'';
  return {lat,lon,ele:ele===''?null:Number(ele),time};
}
function parseTrackDatei(text,dateiname){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('Ungültige XML-Datei');
  const lower=dateiname.toLowerCase(), ergebnisse=[];
  if(lower.endsWith('.kml') || doc.documentElement.localName.toLowerCase()==='kml'){
    [...doc.getElementsByTagNameNS('*','LineString')].forEach((ls,i)=>{
      const coord=ls.getElementsByTagNameNS('*','coordinates')[0]?.textContent||'';
      const points=coord.trim().split(/\s+/).map(v=>{const [lon,lat,ele]=v.split(',').map(Number);return {lat,lon,ele:Number.isFinite(ele)?ele:null,time:''};}).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon));
      if(points.length){
        const name=ls.parentElement?.getElementsByTagNameNS('*','name')[0]?.textContent?.trim()||dateiname.replace(/\.kml$/i,'')+(i?' '+(i+1):'');
        ergebnisse.push({id:'t'+Date.now()+'-'+i,name,format:'KML',distanzKm:streckeKm(points),points:reduzierePunkte(points),notiz:''});
      }
    });
  }else{
    const tracks=[...doc.getElementsByTagNameNS('*','trk')];
    const quellen=tracks.length?tracks:[doc];
    quellen.forEach((trk,i)=>{
      let nodes=[...trk.getElementsByTagNameNS('*','trkpt')];
      if(!nodes.length) nodes=[...trk.getElementsByTagNameNS('*','rtept')];
      if(!nodes.length) nodes=[...trk.getElementsByTagNameNS('*','wpt')];
      const points=nodes.map(punktAusNode).filter(Boolean);
      if(points.length){
        const name=trk.getElementsByTagNameNS('*','name')[0]?.textContent?.trim()||dateiname.replace(/\.gpx$/i,'')+(i?' '+(i+1):'');
        ergebnisse.push({id:'t'+Date.now()+'-'+i,name,format:'GPX',distanzKm:streckeKm(points),points:reduzierePunkte(points),notiz:''});
      }
    });
  }
  return ergebnisse;
}
function handleTrackImport(e){
  const file=e.target.files[0]; e.target.value=''; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const tracks=parseTrackDatei(reader.result,file.name);
      if(!tracks.length) throw new Error('Keine Trackpunkte gefunden');
      state.tracks.push(...tracks); renderTab(); planeSpeichern();
      zeigeToast(`${tracks.length} Track${tracks.length===1?'':'s'} importiert.`);
    }catch(err){ alert('Track konnte nicht eingelesen werden: '+err.message); }
  };
  reader.onerror=()=>alert('Trackdatei konnte nicht gelesen werden.');
  reader.readAsText(file);
}

function uebergabeBereitsImportiert(kennung){state.importierteUebergaben=Array.isArray(state.importierteUebergaben)?state.importierteUebergaben:[];return !!kennung&&state.importierteUebergaben.includes(kennung);}function uebergabeMerken(kennung){if(!kennung)return;state.importierteUebergaben=Array.isArray(state.importierteUebergaben)?state.importierteUebergaben:[];state.importierteUebergaben.push(kennung);state.importierteUebergaben=state.importierteUebergaben.slice(-300);}

/* ---------- Wetter automatisch (Open-Meteo) ---------- */

function wetterAutomatisch(){
  if(!navigator.geolocation){ alert('Standortabfrage wird von diesem Browser nicht unterstützt. Bitte Wetter manuell eintragen.'); return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    try{
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      const cw = data.current_weather;
      if(!cw) throw new Error('keine Daten');
      state.abschluss.temperatur = Math.round(cw.temperature);
      state.abschluss.windrichtung = gradZuKompass(cw.winddirection);
      Object.keys(state.abschluss.wetterlage).forEach(k => state.abschluss.wetterlage[k] = false);
      state.abschluss.wetterlage[wmoZuWetterlage(cw.weathercode)] = true;
      renderTab(); planeSpeichern();
    }catch(err){
      alert('Wetterdaten konnten nicht automatisch geladen werden (keine Verbindung?). Bitte manuell eintragen.');
    }
  }, err => {
    alert('Standort konnte nicht ermittelt werden: ' + err.message);
  }, { enableHighAccuracy:true, timeout:12000 });
}

/* ======================================================================
   IMPORT: RH-Flächensuchassistent (eigenständiges Programm)
   Datei-Brücke per JSON, additiv: bestehende Angaben werden nicht
   überschrieben, ein neuer Suchtrupp + Tagebucheintrag(e) kommen hinzu.

const TAKTIK_KOMPASS_ABK = {Nord:'N',Nordost:'NO',Ost:'O',Südost:'SO',Süd:'S',Südwest:'SW',West:'W',Nordwest:'NW'};
const TAKTIK_RISIKO_LABEL = {trafficRisk:'Verkehr/Bahn',waterRisk:'tiefes Wasser',dropRisk:'Absturz/unklare Begehbarkeit',stormRisk:'Gewitter/Sturm',wildlifeRisk:'Jagd/Wild/Nutztiere',darkRisk:'Dunkelheit/schlechte Sicht'};
const TAKTIK_SYMPTOM_LABEL = {SymFast:'FAST-Auffälligkeit (Schlaganfallverdacht)', SymChest:'Brustschmerz', SymBreath:'Atemnot', SymSeizure:'Krampfanfall', SymAllergy:'Allergie/anaphylaktische Reaktion', SymTrauma:'Trauma'};
function taktikFundBemerkung(f){
  // Reale Einsatz-/Patientendaten (xABCDE, Vitalwerte, Leitsymptome, Maßnahmen, Dringlichkeit) gehören
  // hierher – anders als ins Trainingstagebuch, wo sie aus Datenschutzgründen ausgefiltert werden.
  const parts=[f.meldung];
  if(f.xabcde) parts.push(`xABCDE: x:${f.xabcde.x} A:${f.xabcde.A} B:${f.xabcde.B} C:${f.xabcde.C} D:${f.xabcde.D} E:${f.xabcde.E}`);
  if(f.vitalwerte){
    const v=f.vitalwerte;
    const vitalTeile=[];
    if(v.puls) vitalTeile.push('Puls '+v.puls+'/min');
    if(v.atemfrequenz) vitalTeile.push('AF '+v.atemfrequenz+'/min');
    if(v.blutdruck) vitalTeile.push('RR '+v.blutdruck);
    if(v.spo2) vitalTeile.push('SpO₂ '+v.spo2+'%');
    if(v.temperatur) vitalTeile.push('Temp '+v.temperatur+' °C');
    if(v.blutzucker) vitalTeile.push('BZ '+v.blutzucker+' mg/dl');
    if(v.schmerzskala) vitalTeile.push('Schmerz '+v.schmerzskala+'/10');
    if(vitalTeile.length) parts.push('Vitalwerte: '+vitalTeile.join(', '));
  }
  if(f.leitsymptome && f.leitsymptome.length) parts.push('Leitsymptome: '+f.leitsymptome.map(k=>TAKTIK_SYMPTOM_LABEL[k]||k).join(', '));
  if(f.dringlichkeit && f.dringlichkeit.level && f.dringlichkeit.level!=='unauffaellig'){
    const kraefte=[f.dringlichkeit.nefVorschlag?'NEF':null, f.dringlichkeit.rtwVorschlag?'RTW':null].filter(Boolean).join('+');
    parts.push(`Dringlichkeit (regelbasiert, keine Diagnose): ${f.dringlichkeit.level}${kraefte?' – Vorschlag: '+kraefte:''}`);
  }
  if(f.massnahmenprotokoll && f.massnahmenprotokoll.length) parts.push('Maßnahmen: '+f.massnahmenprotokoll.map(m=>m.zeit+' Uhr '+m.text).join(' / '));
  if(f.notizen) parts.push(f.notizen);
  return parts.filter(Boolean).join(' – ');
}
function taktikGeo(pt){
  return pt && Number.isFinite(pt.lat) && Number.isFinite(pt.lon) ? {lat:pt.lat, lon:pt.lon, acc:'unbekannt'} : null;
}
function setMetaIfEmpty(pfad, wert){
  if(!wert) return false;
  const aktuell = getByPath(state, pfad);
  if(aktuell !== undefined && aktuell !== null && String(aktuell).trim()) return false;
  setByPath(state, pfad, wert);
  return true;
}
function wendeTaktikImportAn(data){
  rhsTeamFromTaktik(data);
  const a=data.auftrag||{}, g=data.gebiet||{}, w=data.wetter||{}, l=data.lage||{}, z=data.zusammenfassung||{}, funde=data.funde||[], t=data.track||null;
  const uebernommen=[];

  if(setMetaIfEmpty('meta.einsatzort', g.placeName)) uebernommen.push('Einsatzort');
  if(setMetaIfEmpty('meta.auftrag', a.assignedArea)) uebernommen.push('Auftrag Rettungshundestaffel');
  if(setMetaIfEmpty('meta.lage', a.incidentWhat)) uebernommen.push('Angaben zur Lage');
  if(setMetaIfEmpty('person.name', a.missingPerson)) uebernommen.push('Name der vermissten Person (bitte prüfen/aufteilen)');

  if(Number.isFinite(w.temperature) && setMetaIfEmpty('abschluss.temperatur', String(w.temperature))) uebernommen.push('Temperatur (Abschluss)');
  if(w.windDirectionCompass && TAKTIK_KOMPASS_ABK[w.windDirectionCompass] && setMetaIfEmpty('abschluss.windrichtung', TAKTIK_KOMPASS_ABK[w.windDirectionCompass])) uebernommen.push('Windrichtung (Abschluss)');
  const wl=state.abschluss.wetterlage;
  if(wl && !Object.values(wl).some(Boolean)){
    if(['rain','drizzle','heavy'].includes(w.precipitation)){ wl.regen=true; uebernommen.push('Wetterlage: Regen'); }
    else if(w.precipitation==='snow'){ wl.schnee=true; uebernommen.push('Wetterlage: Schnee'); }
    else if(w.sun==='strong'){ wl.sonne=true; uebernommen.push('Wetterlage: Sonne'); }
    else if(w.precipitation==='none' && w.sun!=='night'){ wl.klar=true; uebernommen.push('Wetterlage: klar'); }
  }

  // Zusätzlicher, neuer Suchtrupp (überschreibt nie einen bestehenden Eintrag)
  const trupp = neuerSuchtrupp();
  trupp.gebietNr = g.placeName || '';
  trupp.suchart.FL = true;
  const auftragZeilen=[];
  if(a.assignedArea) auftragZeilen.push(a.assignedArea);
  if(z.strategyName) auftragZeilen.push('Vorgehen: '+z.strategyName);
  if(z.strategySteps && z.strategySteps.length) auftragZeilen.push(z.strategySteps.join(' '));
  if(l.priorityInfo) auftragZeilen.push('Prioritäten: '+l.priorityInfo);
  if(z.windAdvice) auftragZeilen.push('Wind: '+z.windAdvice);
  if(t){
    const trackTeile=[];
    if(t.quelle==='live-gps'){
      if(Number.isFinite(t.streckeMeter)) trackTeile.push(t.streckeMeter+' m eigene Strecke (Live-GPS)');
      if(Number.isFinite(t.punkte)) trackTeile.push(t.punkte+' Trackpunkte');
    } else if(t.quelle==='datei-import'){
      trackTeile.push('Track aus Datei importiert');
    }
    if(t.hoehendaten && Number.isFinite(t.hoehendaten.minEle)){
      const h=t.hoehendaten;
      trackTeile.push(h.reliable ? `Höhe ${Math.round(h.minEle)}–${Math.round(h.maxEle)} m, Gefälle ca. ${h.slopePercent.toFixed(1)}%, Richtung ${h.aspectCompass}` : `Höhe ${Math.round(h.minEle)}–${Math.round(h.maxEle)} m (${h.positionClass})`);
    }
    if(trackTeile.length) auftragZeilen.push('Track: '+trackTeile.join(', '));
  }
  trupp.auftrag = auftragZeilen.join('\n');
  const gefahrenTeile=[];
  if(a.knownHazards) gefahrenTeile.push(a.knownHazards);
  if(z.warnings && z.warnings.length) gefahrenTeile.push(z.warnings.join(' '));
  else if(l.risiken && l.risiken.length) gefahrenTeile.push(l.risiken.map(k=>TAKTIK_RISIKO_LABEL[k]||k).join(', '));
  trupp.gefahren = gefahrenTeile.join(' · ');
  trupp.geoStart = taktikGeo(g.startPoint);
  state.suchtrupps.push(trupp);
  const truppIndex = state.suchtrupps.length; // 1-basiert für die Meldung an die Nutzerin

  // Tagebucheintrag zur Nachvollziehbarkeit
  const zusammenfassungKurz = [g.placeName, z.strategyName].filter(Boolean).join(' · ') || 'siehe neuer Suchtrupp';
  state.tagebuch.push({
    zeit: nowHM(), kategorie:'Lage',
    ereignis:'RH-Flächensuchassistent-Daten importiert (Auftrag/Gebiet/Wetter/Taktik) → Suchtrupp '+truppIndex,
    bemerkung: zusammenfassungKurz,
    bearbeiter:'', geo: taktikGeo(g.startPoint)
  });

  // Fundmeldungen aus Schritt 5 des RH-Flächensuchassistenten (inkl. xABCDE, Vitalwerte,
  // Leitsymptome, Maßnahmenprotokoll und regelbasierter Dringlichkeitseinschätzung –
  // anders als beim Trainingstagebuch-Import ist das hier der vorgesehene Ort dafür).
  funde.forEach(f=>{
    state.tagebuch.push({
      zeit: f.zeit || nowHM(), kategorie:'Fund/Hinweis',
      ereignis:'Fundmeldung aus RH-Flächensuchassistent importiert (Fund '+f.nr+')',
      bemerkung: taktikFundBemerkung(f),
      bearbeiter:'', geo: taktikGeo(f)
    });
  });
  if(funde.length) uebernommen.push(funde.length+' Fundmeldung'+(funde.length===1?'':'en'));

  // Kartengeometrie als eigenständige Tracks übernehmen. Dadurch bleiben Suchgebietsgrenze,
  // Hundeführerweg und Hundetrack auch im Einsatzprotokoll sichtbar und GPX-exportierbar.
  const geo=data.geometrie||{}, neueTracks=[];
  const addTrack=(name,points,notiz)=>{
    const sauber=(points||[]).map(p=>({lat:Number(p.lat),lon:Number(p.lon),ele:Number.isFinite(Number(p.ele))?Number(p.ele):null,time:p.time||''})).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon));
    if(sauber.length<2)return;
    neueTracks.push({id:'t'+Date.now()+'-'+neueTracks.length,name,format:'RH-JSON',distanzKm:streckeKm(sauber),points:reduzierePunkte(sauber),notiz});
  };
  if(Array.isArray(geo.suchgebiet)&&geo.suchgebiet.length>=3){
    const rand=geo.suchgebiet.slice();
    const a=rand[0],b=rand[rand.length-1];
    if(a&&b&&(a.lat!==b.lat||a.lon!==b.lon))rand.push({...a});
    addTrack('Suchgebietsgrenze',rand,'Aus RH-Flächensuchassistent');
  }
  (Array.isArray(geo.hundefuehrerTrack)?geo.hundefuehrerTrack:[]).forEach((seg,i)=>addTrack('Hundeführertrack'+(i?' '+(i+1):''),seg,'Gelaufener Weg bis zum Export'));
  addTrack('Importierter Hundeführertrack',geo.importierterTrack,'Aus RH-Flächensuchassistent');
  addTrack('Hundetrack',geo.hundeTrack,'Aus RH-Flächensuchassistent');
  if(neueTracks.length){state.tracks.push(...neueTracks);uebernommen.push(neueTracks.length+' Kartentrack'+(neueTracks.length===1?'':'s'));}

  return {uebernommen, truppIndex};
}
function handleTaktikImport(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || data.bridgeFormat!=='rhs-taktik-assistent-export') throw new Error('falsches-format');
      if(data.mode && data.mode!=='einsatz') throw new Error('kein-einsatz');
      const kennung = data.exportId ? 'taktik|'+data.exportId : '';
      if(uebergabeBereitsImportiert(kennung) && !confirm('Diese Datei aus dem Flächensuchassistenten wurde bereits übernommen. Trotzdem erneut übernehmen? Dabei entsteht ein weiterer Suchtrupp.')) return;
      const res = wendeTaktikImportAn(data);
      uebergabeMerken(kennung);
      renderTab(); planeSpeichern();
      wechsleTab('suche');
      alert('RH-Flächensuchassistent-Daten übernommen: neuer Suchtrupp '+res.truppIndex+' sowie ein Tagebucheintrag wurden angelegt.'+(res.uebernommen.length?'\nZusätzlich automatisch übernommen: '+res.uebernommen.join(', ')+'.':'')+'\n\nBitte den neuen Suchtrupp einem Team zuordnen und alle Angaben prüfen.');
    }catch(err){ alert(err.message==='kein-einsatz'?'Diese Datei stammt aus Training oder Prüfung. In das Einsatzprotokoll werden aus Datenschutz- und Dokumentationsgründen nur Einsatz-Exporte übernommen.':'Datei konnte nicht gelesen werden – bitte eine JSON-Exportdatei des RH-Flächensuchassistenten wählen.'); }
  };
  reader.readAsText(file);
}

/* ---------- Archiv ---------- */

async function einsatzArchivieren(){
  const offen=pruefErgebnis();
  if(offen.length && !confirm(`Die Prüfung zeigt noch ${offen.length} offene Angabe${offen.length===1?'':'n'}. Trotzdem archivieren?`)) return;
  if(!confirm('Aktuellen Einsatz archivieren und ein neues, leeres Protokoll beginnen?')) return;
  const id = 'e' + Date.now();
  try{
    await lokalerSpeicher.set('archiv:'+id, JSON.stringify(state));
    await mitArchivIndexSperre(async()=>{
      let index=[]; try{const r=await lokalerSpeicher.get(KEY_ARCHIV_INDEX);if(r&&r.value)index=JSON.parse(r.value);}catch(e){}
      index.push({id,einsatznummer:state.meta.einsatznummer,datum:state.meta.datum,ort:state.meta.einsatzort,archiviertAm:new Date().toLocaleString('de-DE')});
      await lokalerSpeicher.set(KEY_ARCHIV_INDEX,JSON.stringify(index));
    });
    state = defaultState();
    await speichereZustand();
    renderTab();
    alert('Einsatz archiviert. Neues Protokoll bereit.');
  }catch(err){
    alert('Archivieren fehlgeschlagen. Bitte vorher ein JSON-Backup exportieren.');
  }
}

async function archivLaden(id){
  if(!confirm('Aktuelles Protokoll wird durch den archivierten Einsatz ersetzt. Vorher als JSON sichern?\n\nOK = trotzdem laden')) return;
  try{
    const res = await lokalerSpeicher.get('archiv:'+id);
    state = normalisiereState(JSON.parse(res.value));
    wechsleTab('alarm');
    planeSpeichern();
  }catch(err){ alert('Archiv-Eintrag konnte nicht geladen werden.'); }
}

async function archivLoeschen(id){
  if(!confirm('Diesen Archiv-Eintrag endgültig löschen?')) return;
  try{
    await lokalerSpeicher.delete('archiv:'+id);
    await mitArchivIndexSperre(async()=>{
      let index=[]; try{const r=await lokalerSpeicher.get(KEY_ARCHIV_INDEX);if(r&&r.value)index=JSON.parse(r.value);}catch(e){}
      index=index.filter(e=>e.id!==id); await lokalerSpeicher.set(KEY_ARCHIV_INDEX,JSON.stringify(index));
    });
    renderArchivListe();
  }catch(err){ alert('Löschen fehlgeschlagen.'); }
}

function einsatzZuruecksetzen(){
  if(!confirm('Wirklich ALLE Angaben des aktuellen Protokolls löschen? Das kann nicht rückgängig gemacht werden.')) return;
  if(!confirm('Sicher? Es empfiehlt sich vorher ein JSON-Backup.')) return;
  state = defaultState();
  renderTab(); planeSpeichern();
}

/* ======================================================================
   THEME (Hell/Dunkel)
   ====================================================================== */

function wendeThemeAn(){
  const dark = state.settings.darkMode===null
    ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
    : !!state.settings.darkMode;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const btn = document.getElementById('btn-theme');
  if(btn) btn.textContent = dark ? '☀️' : '🌙';
}
function themeUmschalten(){
  const aktuellDunkel = document.documentElement.getAttribute('data-theme')==='dark';
  state.settings.darkMode = !aktuellDunkel;
  wendeThemeAn();
  planeSpeichern();
}

/* ======================================================================
   UHR
   ====================================================================== */

function tickUhr(){
  const el = document.getElementById('clock');
  if(el) el.textContent = new Date().toLocaleTimeString('de-DE');
}
setInterval(tickUhr, 1000);

function aktualisiereNetzstatus(){
  const el=document.getElementById('netstatus'); if(!el) return;
  const offline=navigator.onLine===false;
  el.textContent=offline?'Keine Verbindung · App läuft offline':'Offline bereit';
  el.classList.toggle('offline',offline);
}
function schnellzugriff(art){
  if(art==='log'){
    state.tagebuch.push(neuerTagebuchEintrag()); planeSpeichern(); wechsleTab('tagebuch');
    setTimeout(()=>document.getElementById('ta-tagebuch-'+(state.tagebuch.length-1))?.focus(),30);
  }else if(art==='trupp'){
    state.suchtrupps.push(neuerSuchtrupp()); planeSpeichern(); wechsleTab('suche');
  }else if(art==='check'){
    wechsleTab('mehr'); setTimeout(()=>document.getElementById('pruefung')?.scrollIntoView({behavior:'smooth'}),30);
  }
}

document.getElementById('quickbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-quick]'); if(b) schnellzugriff(b.dataset.quick);
});
document.getElementById('toastundo').addEventListener('click',()=>{
  if(!letzteLoeschung) return;
  state[letzteLoeschung.list].splice(letzteLoeschung.index,0,letzteLoeschung.item);
  letzteLoeschung=null; document.getElementById('toast').style.display='none'; renderTab(); planeSpeichern();
});
window.addEventListener('online',aktualisiereNetzstatus);
window.addEventListener('offline',aktualisiereNetzstatus);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') speichereZustand(); });
window.addEventListener('pagehide',()=>speichereZustand());
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='s'){ e.preventDefault(); jsonExportieren(); return; }
  if(!e.altKey) return;
  if(e.key.toLowerCase()==='t'){e.preventDefault();schnellzugriff('log');}
  else if(e.key.toLowerCase()==='s'){e.preventDefault();schnellzugriff('trupp');}
  else if(e.key.toLowerCase()==='p'){e.preventDefault();schnellzugriff('check');}
  else if(/^[1-8]$/.test(e.key)){e.preventDefault();wechsleTab(['alarm','person','kraefte','suche','tagebuch','abschluss','anlagen','mehr'][Number(e.key)-1]);}
});

/* ======================================================================
   INIT
   ====================================================================== */

async function init(){
  await ladeZustand();
  ensureRhsExchange();
  document.getElementById('inp-einsatznummer').value = state.meta.einsatznummer || '';
  document.getElementById('inp-einsatznummer').addEventListener('input', e=>{
    state.meta.einsatznummer = e.target.value;
    const feld=document.querySelector('[data-path="meta.einsatznummer"]'); if(feld) feld.value=e.target.value;
    planeSpeichern();
  });
  document.getElementById('btn-theme').addEventListener('click', themeUmschalten);
  aktualisiereNetzstatus();
  wendeThemeAn();
  tickUhr();
  wechsleTab('alarm');
}
init();
